<!DOCTYPE html>
<html>
<head>
    <title>CHUCKSUBG - Game Hub</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding-top: 50px; }
        .game-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .game-card { background: #1f1f1f; border: 2px solid #333; padding: 20px; border-radius: 10px; width: 200px; }
        .btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #ff5e78; transform: translateY(-2px); }
        #score-display { font-size: 24px; color: #00d4ff; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>CHUCKSUBG</h1>
    <p>a fun game place weee</p>
    <hr style="width: 50%; border: 0.5px solid #333; margin-bottom: 30px;">
    
    <div class="game-container">
        <div class="game-card">
            <h3>Clicker Quest</h3>
            <div id="score-display">Clicks: 0</div>
            <button class="btn" onclick="addPoint()">TAP TO PLAY</button>
        </div>

        <div class="game-card">
            <h3>Space Dodge</h3>
            <p style="color: #666;">Coming Soon...</p>
            <button class="btn" style="background: #444;">LOCKED</button>
        </div>
    </div>

    <script>
        // This is the "brain" of your game
        let score = 0;
        
        function addPoint() {
            score = score + 1; // Increase score
            document.getElementById("score-display").innerHTML = "Clicks: " + score;
            
            // A little reward message
            if (score === 10) { alert("Novice Clicker Unlocked!"); }
            if (score === 50) { alert("Clicking Pro!"); }
        }
    </script>
</body>
</html>
