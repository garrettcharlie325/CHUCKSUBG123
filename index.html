<!DOCTYPE html>
<html>
<head>
    <title>CHIRKS UNBLOCKED GAMES HUB</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding-top: 50px; }
        .game-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .game-card { background: #161b22; border: 1px solid #30363d; padding: 25px; border-radius: 12px; width: 220px; }
        .btn { background: #238636; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        #score-display { font-size: 24px; color: #58a6ff; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>CHIRKS UNBLOCKED GAMES HUB</h1>
    <p>the ultimate spot for fun weee</p>
    
    <div class="game-container">
        <div class="game-card">
            <h3>Clicker Quest</h3>
            <div id="score-display">Clicks: 0</div>
            <button class="btn" onclick="addPoint()">TAP TO PLAY</button>
        </div>
    </div>

    <script>
        let score = 0;
        function addPoint() {
            score = score + 1;
            document.getElementById("score-display").innerHTML = "Clicks: " + score;
        }
    </script>
    
    <p style="margin-top: 50px; color: #444;">Site Version: 2.0 (Chirks Edition)</p>
</body>
</html>
